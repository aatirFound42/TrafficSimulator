behaviors:
  FourWaySignal: # <-- MUST MATCH YOUR UNITY INSPECTOR BEHAVIOR NAME
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128      # 128 is the sweet spot for a 13-variable state
      num_layers: 2          # 2 layers is plenty for this complexity
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99          # 0.99 means the agent cares heavily about the long-term future
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 2000000       # 2 million steps gives it plenty of time to master traffic
    time_horizon: 64
    summary_freq: 10000      # Updates the terminal every 10,000 steps (perfect speed)